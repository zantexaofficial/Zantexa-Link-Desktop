<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws: wss:; media-src 'self' blob:">
  <title>Join classroom</title>
  <link rel="stylesheet" href="/classroom-student.css">
</head>
<body>
  <h1>Classroom</h1>
  <form id="join">
    <label>Room code <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
    <label>Your name <input id="name" autocomplete="name" maxlength="48" required></label>
    <button type="submit">Request to join</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <video id="screen" autoplay playsinline controls hidden></video>
  <section id="files-section" aria-label="Files shared by the teacher" hidden>
    <h2>Files from the teacher</h2>
    <div id="files"></div>
  </section>
  <script src="/classroom-file-transfer.js" defer></script>
  <script src="/classroom-student.js" defer></script>
</body>
</html>
