name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check tag and app versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tags must look like v2.5.0"; exit 1; }
          VERSION="${TAG#v}"
          for file in windows/package.json mac/package.json linux/package.json; do
            actual=$(node -p "require('./$file').version")
            [[ "$actual" == "$VERSION" ]] || { echo "::error::$file has version $actual, expected $VERSION"; exit 1; }
          done
          grep -Fq "versionName = \"$VERSION\"" android/app/build.gradle.kts || { echo "::error::Android version does not match $VERSION"; exit 1; }

      - name: Check the release is not already public
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            [[ "$is_draft" == "true" ]] || { echo "::error::Release $TAG is already public; use a new version tag"; exit 1; }
          fi

  windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  macos:
    needs: prepare
    uses: ./.github/workflows/build-mac.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  android:
    needs: prepare
    uses: ./.github/workflows/build-android.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  arch:
    needs: linux
    uses: ./.github/workflows/build-aur.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  publish:
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          release_id=$(gh release view "$TAG" --json databaseId --jq '.databaseId')
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -f make_latest=true
