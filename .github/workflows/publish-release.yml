name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check tag and app versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tags must look like v2.5.0"; exit 1; }
          VERSION="${TAG#v}"
          for file in windows/package.json mac/package.json linux/package.json; do
            actual=$(node -p "require('./$file').version")
            [[ "$actual" == "$VERSION" ]] || { echo "::error::$file has version $actual, expected $VERSION"; exit 1; }
          done
          grep -Fq "versionName = \"$VERSION\"" android/app/build.gradle.kts || { echo "::error::Android version does not match $VERSION"; exit 1; }

      - name: Check the release is not already public
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            [[ "$is_draft" == "true" ]] || { echo "::error::Release $TAG is already public; use a new version tag"; exit 1; }
          fi

  windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  macos:
    needs: prepare
    uses: ./.github/workflows/build-mac.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  android:
    needs: prepare
    uses: ./.github/workflows/build-android.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  arch:
    needs: linux
    uses: ./.github/workflows/build-aur.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  publish:
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          release=$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/releases/tags/$TAG")
          release_id=$(jq -er '.id' <<<"$release")
          is_draft=$(jq -er '.draft' <<<"$release")
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release $TAG is not a draft; refusing to change an already published release"
            exit 1
          fi

          published=$(curl --fail-with-body --silent --show-error --request PATCH "${headers[@]}" \
            --header "Content-Type: application/json" \
            --data '{"draft":false,"make_latest":"true"}' \
            "$api/releases/$release_id")
          if [[ $(jq -er '.draft' <<<"$published") != "false" ]]; then
            echo "::error::GitHub did not publish release $TAG"
            exit 1
          fi
          echo "Published release $TAG with $(jq '.assets | length' <<<"$published") assets"
