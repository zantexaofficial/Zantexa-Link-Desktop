name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check tag and app versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tags must look like v2.5.0"; exit 1; }
          VERSION="${TAG#v}"
          for file in windows/package.json mac/package.json linux/package.json; do
            actual=$(node -p "require('./$file').version")
            [[ "$actual" == "$VERSION" ]] || { echo "::error::$file has version $actual, expected $VERSION"; exit 1; }
          done
          grep -Fq "versionName = \"$VERSION\"" android/app/build.gradle.kts || { echo "::error::Android version does not match $VERSION"; exit 1; }

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            [[ "$is_draft" == "true" ]] || { echo "::error::Release $TAG is already public; use a new version tag"; exit 1; }
          else
            gh release create "$TAG" --draft --target "$TAG" --title "$TAG" --notes ""
          fi

  windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  macos:
    needs: prepare
    uses: ./.github/workflows/build-mac.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  android:
    needs: prepare
    uses: ./.github/workflows/build-android.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  arch:
    needs: linux
    uses: ./.github/workflows/build-aur.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    secrets: inherit

  publish:
    needs: [windows, macos, linux, android, arch]
    runs-on: ubuntu-latest
    steps:
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          required=(
            '^Zantexa-Link-Setup-[0-9.]+\.exe$'
            '^Zantexa-Link-Setup-[0-9.]+-arm64\.exe$'
            '^Zantexa Link-[0-9.]+-arm64\.dmg$'
            '^Zantexa Link-[0-9.]+-x64\.dmg$'
            '^Zantexa-Link-[0-9.]+-x64\.AppImage$'
            '^Zantexa-Link-[0-9.]+-x64\.deb$'
            '^Zantexa Link-[0-9.]+\.apk$'
            '^Zantexa Link-[0-9.]+-full\.apk$'
            '^twindesk-bin-[0-9.]+-[0-9]+-x86_64\.pkg\.tar\.zst$'
          )
          for pattern in "${required[@]}"; do
            if ! grep -Eq "$pattern" <<<"$assets"; then
              echo "::error::Release $TAG is missing a required asset matching $pattern"
              exit 1
            fi
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
